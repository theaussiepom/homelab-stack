  memory_mib: 1024
  root_gib: 4
  os_reserve_mib: 256
startup:
  started: true
  start_on_boot: true
  boot_order: 20
security:
  unprivileged: true
  protection: true
  nesting: true
  keyctl: false
software: []
runtime: []
monitoring:
  profile: linux-agent
