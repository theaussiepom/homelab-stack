schema: homelab-components-v1
kind: guest
context: lab
template: base
lifecycle: fresh
identity:
  vmid: 611
  hostname: example-home
template_file_id: example:vztmpl/debian.tar.zst
root_storage: local
interfaces:
  primary:
    network: services
    slot: 0
    mac: 02:00:00:20:00:11
    address:
      mode: static
      value: 198.18.20.11
    default_route: true
    ipv6: manual
network_policy:
- policy: deployment
  endpoints:
    runner:
      external: runner
- policy: downloads
  address_groups:
    internet: internet
- policy: recursive_dns
  address_groups:
    internet: internet
display_name: Home
control_interface: primary
resources:
  cpu_cores: 2
  memory_mib: 3072
  root_gib: 8
  os_reserve_mib: 256
volumes:
  apps:
    storage: local
    slot: 0
    path: /srv/example/apps
    size_gib: 4
