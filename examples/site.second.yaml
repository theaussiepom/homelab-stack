# Synthetic alternate placement: independent HA plus repeated resolver instances.
schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.19.40.2
    port: 22
networks:
  services:
    context: lab
    cidr: 198.19.40.0/25
    bridge: vmbr-example-alt
    vlan: 320
    gateway: 198.19.40.1
  clients:
    context: lab
    cidr: 198.19.50.0/24
    bridge: vmbr-example-clients
    vlan: 321
    gateway: 198.19.50.1
storage:
  local:
    context: lab
    pool: example-local
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination: 0.0.0.0/0
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination: 0.0.0.0/0
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination: 0.0.0.0/0
        comment: Recursive DNS
guests:
  resolver-east:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 711
      hostname: example-resolver-east
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:40:00:11
        address:
          mode: static
          value: 198.19.40.11
        default_route: true
        ipv6: manual
      clients:
        network: clients
        slot: 1
        mac: 02:00:00:50:00:11
        address:
          mode: static
          value: 198.19.50.11
        default_route: false
        ipv6: manual
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - downloads
    - recursive_dns
    display_name: East resolver
    control_interface: primary
  resolver-west:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 712
      hostname: example-resolver-west
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:40:00:12
        address:
          mode: static
          value: 198.19.40.12
        default_route: true
        ipv6: manual
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - downloads
    - recursive_dns
    display_name: West resolver
    control_interface: primary
  home-app:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 713
      hostname: example-home
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:40:00:13
        address:
          mode: static
          value: 198.19.40.13
        default_route: true
        ipv6: manual
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - downloads
    - recursive_dns
    display_name: Home
    control_interface: primary
    resources:
      cpu_cores: 2
      memory_mib: 3072
      root_gib: 8
      os_reserve_mib: 256
    volumes:
      apps:
        storage: local
        slot: 0
        path: /srv/example/apps
        size_gib: 4
apps:
  local_primary:
    profile: unbound
    guest: resolver-east
    lifecycle: fresh
    interfaces:
      service:
        scope: guest-loopback
      private:
        scope: app-network
        network: default
    display_name: Primary DNS
  local_backup:
    profile: unbound
    guest: resolver-east
    lifecycle: fresh
    interfaces:
      service:
        scope: guest-loopback
      private:
        scope: app-network
        network: default
    display_name: Backup DNS
    properties:
      publish_port: 5336
  remote_primary:
    profile: unbound
    guest: resolver-west
    lifecycle: fresh
    interfaces:
      service:
        scope: guest-loopback
      private:
        scope: app-network
        network: default
    display_name: Remote DNS
  home:
    profile: homeassistant-public
    guest: home-app
    lifecycle: fresh
    interfaces:
      web:
        interface: primary
    storage:
      config:
        volume: apps
        subpath: homeassistant
