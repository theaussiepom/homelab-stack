# Complete SYNTHETIC source-only composition. Retained entries require an already owned installation.
schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
    timezone: Etc/UTC
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  identity:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 850
      hostname: example-identity
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:32
        address:
          mode: static
          value: 198.18.20.50
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/identity
    compose_projects:
      identity:
        name: example-identity
        file: compose-identity.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: connect_identity_database
    - policy: identity_web_in
  monitoring:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 851
      hostname: example-monitoring
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:33
        address:
          mode: static
          value: 198.18.20.51
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/monitoring
    compose_projects:
      monitoring:
        name: example-monitoring
        file: compose-monitoring.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: connect_monitoring_database
    - policy: monitor_web_in
  monitoring-storage:
    context: lab
    template: base
    lifecycle: retained
    identity:
      vmid: 852
      hostname: example-monitoring-storage
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 3072
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:34
        address:
          mode: static
          value: 198.18.20.52
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/monitoring-storage
      native:
        path: /var/lib/postgresql
    compose_projects: {}
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: connect_monitoring_database_incoming
  ingress:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 1000
      hostname: example-ingress
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:c8
        address:
          mode: static
          value: 198.18.20.200
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/ingress
    compose_projects:
      ingress:
        name: example-ingress
        file: compose-ingress.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: monitor_web_out
    - policy: identity_web_out
apps:
  identity:
    profile: authentik
    guest: identity
    lifecycle: retained
    interfaces:
      web_interface:
        interface: primary
      private_interface:
        scope: app-network
        network: default
      postgresql_interface:
        interface: primary
    storage:
      media:
        root_path: data
        subpath: identity/media
      templates:
        root_path: data
        subpath: identity/templates
      certs:
        root_path: data
        subpath: identity/certs
      data:
        root_path: data
        subpath: identity/files
    identity:
      phase: identity
      runtime_id: example-identity
      services:
        server: identity_server
        worker: identity_worker
      networks:
        default: default
      runtime_directory: /opt/homelab-app/runtime/identity
      project: identity
    secrets:
      secret_key: identity_secret_key
      postgresql_password: identity_postgresql_password
    properties:
      database:
        name: example_identity
        user: example_identity
  monitoring:
    profile: zabbix
    guest: monitoring
    lifecycle: retained
    interfaces:
      web_interface:
        interface: primary
      server_interface:
        interface: primary
      postgresql_interface:
        interface: primary
      private_interface:
        scope: app-network
        network: default
    storage: {}
    identity:
      phase: monitoring
      runtime_id: example-monitoring
      services:
        zabbix_server: monitoring_zabbix_server
        zabbix_web: monitoring_zabbix_web
      networks:
        default: default
      runtime_directory: /opt/homelab-app/runtime/monitoring
      project: monitoring
    properties:
      database:
        name: example_monitoring
        user: example_monitoring
    origin:
      exposure: monitor
    authentication: monitor_login
  monitoring_storage:
    profile: postgresql
    guest: monitoring-storage
    lifecycle: retained
    interfaces:
      service_interface:
        interface: primary
    storage:
      data:
        root_path: native
        subpath: ''
    identity:
      phase: monitoring_storage
      runtime_id: example-monitoring_storage
      services: {}
      networks: {}
  ingress:
    profile: traefik
    guest: ingress
    lifecycle: retained
    interfaces:
      frontend_interface:
        interface: primary
      management_interface:
        interface: primary
    storage:
      certs:
        root_path: data
        subpath: ingress/certs
    identity:
      phase: ingress
      runtime_id: example-ingress
      services:
        traefik: ingress_traefik
      networks: {}
      runtime_directory: /opt/homelab-app/runtime/ingress
      project: ingress
    properties:
      provider:
        context: lab
        token_id: example@pve!reader
      acme:
        email: admin@example.invalid
        resolvers:
        - external: resolver
    secrets:
      cloudflare_dns_token: ingress_cloudflare_dns_token
      proxmox_token: ingress_proxmox_token
domains:
  identity: login.example.invalid
  monitor: monitor.example.invalid
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
  identity_database:
    protocol: tcp
    address: 192.0.2.60
    port: 5432
identity_providers:
  monitor_identity:
    type: saml
    signing_certificate: '-----BEGIN CERTIFICATE-----

      MIIC8jCCAdqgAwIBAgIBATANBgkqhkiG9w0BAQsFADAyMTAwLgYDVQQDDCdzeW50

