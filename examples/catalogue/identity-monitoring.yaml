secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
  identity_secret_key:
    type: file
    path: /run/example/identity_secret_key
  identity_postgresql_password:
    type: file
    path: /run/example/identity_postgresql_password
  ingress_cloudflare_dns_token:
    type: file
    path: /run/example/ingress_cloudflare_dns_token
  ingress_proxmox_token:
    type: file
    path: /run/example/ingress_proxmox_token
accounts: {}
devices: {}
evidence: {}
connections:
  identity_database:
    consumer:
      app: identity
      connection: database
    target:
      external: identity_database
    source_interface: postgresql_interface
  monitoring_database:
    consumer:
      app: monitoring
      connection: database
    target:
      app: monitoring_storage
      endpoint: backend_endpoint
    source_interface: postgresql_interface
exposures:
  identity:
    type: http
    target:
      app: identity
      endpoint: web_endpoint
    domain: identity
    ingress:
      app: ingress
      endpoint: https_endpoint
    tls: public
  monitor:
    type: http
    target:
      app: monitoring
      endpoint: web_endpoint
    domain: monitor
    ingress:
      app: ingress
      endpoint: https_endpoint
    tls: public
images: {}
host_aliases: {}
address_groups:
  internet:
    members:
    - 0.0.0.0/0
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination:
          address_group: internet
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
    connect_identity_database:
      rules:
      - direction: out
        proto: tcp
        destination: 192.0.2.60/32
        port: '5432'
        comment: Selected identity_database relationship
    connect_monitoring_database:
      rules:
      - direction: out
        proto: tcp
        destination: 198.18.20.52/32
        port: '5432'
        comment: Selected monitoring_database relationship
    connect_monitoring_database_incoming:
      rules:
      - direction: in
        proto: tcp
        source: 198.18.20.51/32
        port: '5432'
        comment: Selected monitoring_database client
    identity_web_in:
      rules:
      - direction: in
        proto: tcp
        source: 198.18.20.200/32
        port: '9000'
        comment: Selected identity provider
    identity_web_out:
      rules:
      - direction: out
        proto: tcp
        destination: 198.18.20.50/32
        port: '9000'
        comment: Selected identity provider
    monitor_web_in:
      rules:
      - direction: in
        proto: tcp
        source: 198.18.20.200/32
        port: '8080'
        comment: Monitoring web from ingress
    monitor_web_out:
      rules:
      - direction: out
        proto: tcp
        destination: 198.18.20.51/32
        port: '8080'
        comment: Monitoring web endpoint
  transport: {}
  tls:
    public:
      type: acme
      resolver: letsencrypt
  middlewares: {}
  authentication:
    monitor_login:
      type: zabbix-saml
      provider: monitor_identity
      default_login: saml
      registration:
        slug: monitor
        application_name: Example monitoring
        provider_name: Example monitoring
        issuer: monitor
        signing_key: Example signing key
        admission_group: Monitoring operators
        authentication_flow: null
        authorization_flow: default-provider-authorization-implicit-consent
        invalidation_flow: default-provider-invalidation-flow
        policy_engine_mode: any
        session_minutes: 86400
        attribute_mappings:
        - email
        - groups
        - name
        - upn
        - uid
        - username
        - ms-windowsaccountname
zabbix:
  server: monitoring
