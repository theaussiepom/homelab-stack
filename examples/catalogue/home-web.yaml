schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
    timezone: Etc/UTC
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  automation:
    context: lab
    template: docker
    lifecycle: fresh
    identity:
      vmid: 830
      hostname: example-automation
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:1e
        address:
          mode: static
          value: 198.18.20.30
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/homeassistant-public
    compose_projects: {}
    network_policy:
    - policy: home_ingress
      endpoints:
        edge:
          app: edge
          endpoint: https_endpoint
        home:
          app: home
          endpoint: web_endpoint
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    volumes:
      apps:
        storage: local
        slot: 0
        path: /srv/example/apps
        size_gib: 4
  edge:
    context: lab
    template: docker
    lifecycle: fresh
    identity:
      vmid: 870
      hostname: example-edge
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:46
        address:
          mode: static
          value: 198.18.20.70
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/edge
    compose_projects:
      edge:
        name: example-edge
        file: compose-edge.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: home_backend
      endpoints:
        home:
          app: home
          endpoint: web_endpoint
apps:
  home:
    profile: homeassistant
    guest: automation
    lifecycle: fresh
    interfaces:
      web_interface:
        interface: primary
    storage:
      config:
        volume: apps
        subpath: homeassistant
  edge:
    profile: traefik
    guest: edge
    lifecycle: fresh
    interfaces:
      frontend_interface:
        interface: primary
      management_interface:
        interface: primary
    storage:
      certs:
        root_path: data
        subpath: edge/certs
    identity:
      phase: edge
      runtime_id: example-edge
      services:
        traefik: edge_traefik
      networks: {}
      runtime_directory: /opt/homelab-app/runtime/edge
      project: edge
    properties:
      provider:
        context: lab
        token_id: example@pve!reader
      acme:
        email: admin@example.invalid
        resolvers:
        - external: resolver
    secrets:
      cloudflare_dns_token: edge_cloudflare_dns_token
      proxmox_token: edge_proxmox_token
domains:
  home: home.example.invalid
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
identity_providers: {}
secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
  edge_cloudflare_dns_token:
    type: file
    path: /run/example/edge_cloudflare_dns_token
  edge_proxmox_token:
    type: file
    path: /run/example/edge_proxmox_token
  manager_database_key:
    type: file
    path: /run/example/manager_database_key
accounts: {}
devices: {}
evidence: {}
connections: {}
exposures:
  home_web:
    type: http
    target:
      app: home
      endpoint: web_endpoint
    domain: home
    ingress:
      app: edge
      endpoint: https_endpoint
    tls: site_certificate
images: {}
host_aliases: {}
address_groups:
  internet:
    members:
    - 0.0.0.0/0
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination:
          address_group: internet
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
    provider_api:
      rules:
      - direction: out
        proto: tcp
        destination:
          endpoint: provider
        port:
          endpoint: provider
        comment: Selected hypervisor API
    home_ingress:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: edge
        destination:
          endpoint: home
        port:
          endpoint: home
        comment: Home web from ingress
    home_backend:
      rules:
      - direction: out
        proto: tcp
        destination:
          endpoint: home
        port:
          endpoint: home
        comment: Home web backend
  transport: {}
  tls:
    site_certificate:
      type: acme
      resolver: letsencrypt
  middlewares: {}
  authentication: {}
