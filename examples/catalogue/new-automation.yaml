# Complete SYNTHETIC source-only composition. Retained entries require an already owned installation.
schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
    timezone: Etc/UTC
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  homeassistant-public:
    context: lab
    template: docker
    lifecycle: fresh
    identity:
      vmid: 830
      hostname: example-homeassistant-public
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:1e
        address:
          mode: static
          value: 198.18.20.30
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/homeassistant-public
    compose_projects: {}
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    volumes:
      apps:
        storage: local
        slot: 0
        path: /srv/example/apps
        size_gib: 4
  node_red-public:
    context: lab
    template: docker
    lifecycle: fresh
    identity:
      vmid: 831
      hostname: example-node-red-public
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:1f
        address:
          mode: static
          value: 198.18.20.31
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/node_red-public
    compose_projects: {}
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    volumes:
      apps:
        storage: local
        slot: 0
        path: /srv/example/apps
        size_gib: 4
apps:
  homeassistant:
    profile: homeassistant
    guest: homeassistant-public
    lifecycle: fresh
    interfaces:
      web:
        interface: primary
    storage:
      config:
        volume: apps
        subpath: homeassistant-public
  node_red:
    profile: node_red
    guest: node_red-public
    lifecycle: fresh
    interfaces:
      web:
        interface: primary
    storage:
      data:
        volume: apps
        subpath: node_red-public
domains: {}
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
identity_providers: {}
secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
accounts: {}
devices: {}
evidence: {}
connections: {}
exposures: {}
images: {}
host_aliases: {}
address_groups:
  internet:
    members:
    - 0.0.0.0/0
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination:
          address_group: internet
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
  transport: {}
  tls: {}
  middlewares: {}
  authentication: {}
