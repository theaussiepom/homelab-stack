schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
    timezone: Etc/UTC
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
guests:
  homeassistant:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 820
      hostname: example-homeassistant
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:14
        address:
          mode: static
          value: 198.18.20.20
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/homeassistant
    compose_projects:
      homeassistant:
        name: example-homeassistant
        file: compose-homeassistant.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
  node-red:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 821
      hostname: example-node-red
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:15
        address:
          mode: static
          value: 198.18.20.21
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/node-red
    compose_projects:
      node_red:
        name: example-node_red
        file: compose-node_red.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: ingress_node_red_in
  ingress:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 1000
      hostname: example-ingress
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:c8
        address:
          mode: static
          value: 198.18.20.200
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/ingress
    compose_projects:
      ingress:
        name: example-ingress
        file: compose-ingress.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: ingress_node_red
    - policy: identity_web_out
  identity:
    context: lab
    template: docker
    lifecycle: retained
    identity:
      vmid: 850
      hostname: example-identity
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    control_interface: primary
    resources:
      memory_mib: 4096
      cpu_cores: 2
      root_gib: 8
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:01:32
        address:
          mode: static
          value: 198.18.20.50
        default_route: true
        ipv6: manual
    root_paths:
      data:
        path: /srv/example/identity
    compose_projects:
      identity:
        name: example-identity
        file: compose-identity.yml
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - policy: downloads
      address_groups:
        internet: internet
    - policy: connect_identity_database
    - policy: identity_web_in
apps:
  homeassistant:
    profile: homeassistant-bound
    guest: homeassistant
    lifecycle: retained
    interfaces:
      web_interface:
        interface: primary
    storage:
      config:
        root_path: data
        subpath: homeassistant/config
    identity:
      phase: homeassistant
      runtime_id: example-homeassistant
      services:
        homeassistant: homeassistant_homeassistant
      networks: {}
      project: homeassistant
  node_red:
    profile: node_red-bound
    display_name: Example editor
    guest: node-red
    lifecycle: retained
    interfaces:
      web_interface:
        interface: primary
    storage:
      data:
        root_path: data
        subpath: node_red/data
      config:
        root_path: data
        subpath: node_red/config
      settings:
        root_path: data
        subpath: node_red/settings.js
      healthcheck:
        root_path: data
        subpath: node_red/healthcheck.js
    identity:
      phase: node_red
      runtime_id: example-node_red
      services:
        node_red: node_red_node_red
      networks: {}
      project: node_red
    origin:
      exposure: node_red
    authentication: node_red
  ingress:
    profile: traefik
    guest: ingress
    lifecycle: retained
    interfaces:
      frontend_interface:
        interface: primary
      management_interface:
        interface: primary
    storage:
      certs:
        root_path: data
        subpath: ingress/certs
    identity:
      phase: ingress
      runtime_id: example-ingress
      services:
        traefik: ingress_traefik
      networks: {}
      runtime_directory: /opt/homelab-app/runtime/ingress
      project: ingress
    properties:
      provider:
        context: lab
        token_id: example@pve!reader
      acme:
        email: admin@example.invalid
        resolvers:
        - external: resolver
    secrets:
      cloudflare_dns_token: ingress_cloudflare_dns_token
      proxmox_token: ingress_proxmox_token
  identity:
    profile: authentik
    guest: identity
    lifecycle: retained
    interfaces:
      web_interface:
        interface: primary
      private_interface:
        scope: app-network
        network: default
      postgresql_interface:
        interface: primary
    storage:
      media:
        root_path: data
        subpath: identity/media
      templates:
        root_path: data
        subpath: identity/templates
      certs:
        root_path: data
        subpath: identity/certs
      data:
        root_path: data
        subpath: identity/files
    identity:
      phase: identity
      runtime_id: example-identity
      services:
        server: identity_server
        worker: identity_worker
      networks:
        default: default
      runtime_directory: /opt/homelab-app/runtime/identity
      project: identity
    secrets:
      secret_key: identity_secret_key
      postgresql_password: identity_postgresql_password
    properties:
      database:
        name: example_identity
        user: example_identity
domains:
  node_red: node-red.example.invalid
  identity: identity.example.invalid
  editor_alias: flow-alias.example.invalid
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
  identity_database:
    protocol: tcp
    address: 192.0.2.60
    port: 5432
identity_providers:
  login:
    type: oidc
    origin:
      exposure: identity
    issuer_path: /application/o/example-flow/
    endpoints:
      authorization: /application/o/authorize/
      token: /application/o/token/
      userinfo: /application/o/userinfo/
      jwks: /application/o/example-flow/jwks/
    signing_algorithms:
    - RS256
secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
  ingress_cloudflare_dns_token:
    type: file
    path: /run/example/ingress_cloudflare_dns_token
  ingress_proxmox_token:
    type: file
    path: /run/example/ingress_proxmox_token
  identity_secret_key:
    type: file
    path: /run/example/identity_secret_key
  identity_postgresql_password:
    type: file
    path: /run/example/identity_postgresql_password
  editor_oidc:
    type: file
    path: /run/example/editor-oidc
accounts: {}
devices: {}
evidence: {}
connections:
  identity_database:
    consumer:
      app: identity
      connection: database
    target:
      external: identity_database
    source_interface: postgresql_interface
exposures:
  node_red:
    type: http
    target:
      app: node_red
      endpoint: web_endpoint
    domain: node_red
    ingress:
      app: ingress
      endpoint: https_endpoint
    tls: public
    aliases:
    - editor_alias
  identity:
    type: http
    target:
      app: identity
      endpoint: web_endpoint
    domain: identity
    ingress:
      app: ingress
      endpoint: https_endpoint
    tls: public
images: {}
host_aliases: {}
address_groups:
  internet:
    members:
    - 0.0.0.0/0
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination:
          address_group: internet
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
    ingress_node_red:
      rules:
      - direction: out
        proto: tcp
        destination: 198.18.20.21/32
        port: '1880'
        comment: Selected node_red route backend
    ingress_node_red_in:
      rules:
      - direction: in
        proto: tcp
        source: 198.18.20.200/32
        port: '1880'
        comment: Selected node_red ingress
    connect_identity_database:
      rules:
      - direction: out
        proto: tcp
        destination: 192.0.2.60/32
        port: '5432'
        comment: Selected identity_database relationship
    identity_web_in:
      rules:
      - direction: in
        proto: tcp
        source: 198.18.20.200/32
        port: '9000'
        comment: Selected identity provider
    identity_web_out:
      rules:
      - direction: out
        proto: tcp
        destination: 198.18.20.50/32
        port: '9000'
        comment: Selected identity provider
  transport: {}
  tls:
    public:
      type: acme
      resolver: letsencrypt
  middlewares: {}
  authentication:
    node_red:
      type: node-red-retained-oidc
      provider: login
      client_id: example-flow
      registration:
        slug: example-flow
        provider_name: Example editor
        admission_group: Editor operators
        signing_key: Example identity key
        authentication_flow: null
        authorization_flow: example-consent
        invalidation_flow: example-logout
        policy_engine_mode: any
        launch_url: ''
        callback_aliases:
        - editor_alias
        client_secret: editor_oidc
        secret_slot: 2
