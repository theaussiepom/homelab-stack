config:
  guest:
    vmid: ${vmids.music}
    hostname: ${hostnames.music}
    cpu: 2
    memory_mib: 2048
    root_gib: 8
    storage_id: ${storage.guest}
    template_file_id: ${templates.debian_lxc}
    started: true
    start_on_boot: true
    boot_order: 65
    nesting: true
    keyctl: false
    dns_servers:
      - ${addresses.dns}
      - ${addresses.fallback_dns}
    interfaces:
      - bridge: ${bridges.management}
        vlan: ${vlans.management}
        mac: ${mac.music.0}
        ipv4: ${addresses.music_management}/${prefixes.management}
        ipv6: manual
        gateway: ${gateways.management}
      - bridge: ${bridges.http_backend}
        vlan: ${vlans.http_backend}
        mac: ${mac.music.1}
        ipv4: ${addresses.music_backend}/${prefixes.http_backend}
        ipv6: manual
      - bridge: ${bridges.home}
        vlan: ${vlans.home}
        mac: ${mac.music.2}
        ipv4: ${addresses.music_home}/${prefixes.home}
        ipv6: manual
    volumes:
      data:
        path: /srv/homelab
        size_gib: 16
    rules:
      - direction: in
        proto: tcp
        port: '22'
        source: ${addresses.runner}/32
        destination: ${addresses.music_management}/32
        comment: Deployment runner SSH only
      - direction: out
        proto: tcp
        port: '53'
        destination: ${addresses.dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: udp
        port: '53'
        destination: ${addresses.dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: tcp
        port: '53'
        destination: ${addresses.fallback_dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: udp
        port: '53'
        destination: ${addresses.fallback_dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: tcp
        port: 80,443
        source: ${addresses.music_management}/32
        destination: 0.0.0.0/0
        interface: net0
        comment: Packages, selected upstream image and provider HTTPS
      - direction: out
        proto: tcp
        port: '443'
        source: ${addresses.music_home}/32
        destination: ${addresses.ingress_frontend}/32
        interface: net2
        comment: Music HTTPS route health from its allowed Home address
      - direction: in
        proto: tcp
        port: '8095'
        comment: Traefik Music Assistant frontend
        source: ${addresses.ingress_management}/32
        destination: ${addresses.music_home}/32
      - direction: in
        proto: tcp
        port: '8095'
        comment: Existing Home Assistant integration
        source: ${addresses.automation_home}/32
        destination: ${addresses.music_home}/32
      - direction: in
        proto: tcp
        port: 8097,8927
        comment: Existing player stream and Sendspin callbacks
        source: ${networks.home}/${prefixes.home}
        destination: ${addresses.music_home}/32
      - direction: in
        proto: udp
        port: '5353'
        comment: Existing player multicast discovery
        source: ${networks.home}/${prefixes.home}
        destination: 224.0.0.251/32
        interface: net2
      - direction: out
        proto: udp
        port: '5353'
        comment: Existing player multicast discovery
        source: ${addresses.music_home}/32
        destination: 224.0.0.251/32
        interface: net2
      - direction: in
        proto: udp
        port: '1900'
        comment: Existing player multicast discovery
        source: ${networks.home}/${prefixes.home}
        destination: 239.255.255.250/32
        interface: net2
      - direction: out
        proto: udp
        port: '1900'
        comment: Existing player multicast discovery
        source: ${addresses.music_home}/32
        destination: 239.255.255.250/32
        interface: net2
      - direction: out
        proto: tcp
        port: null
        comment: Existing player/provider callbacks
        source: ${addresses.music_home}/32
        destination: ${networks.home}/${prefixes.home}
        interface: net2
      - direction: out
        proto: udp
        port: null
        comment: Existing player/provider callbacks
        source: ${addresses.music_home}/32
        destination: ${networks.home}/${prefixes.home}
        interface: net2
  app:
    kind: music
    vmid: ${vmids.music}
    hostname: ${hostnames.music}
    memory_mib: 2048
    address: ${addresses.music_management}
    mac: ${mac.music.0}
    packages:
      - docker.io=26.1.5+dfsg1-9+deb13u1
      - docker-cli=26.1.5+dfsg1-9+deb13u1
      - docker-compose=2.26.1-4
      - curl=8.14.1-2+deb13u7
    stack_config: ${inputs}/stack.json
    exclusive_writer_confirmed: false
    frontend_routing:
      address: ${addresses.music_home}/${prefixes.home}
      gateway: ${gateways.home}
      mac: ${mac.music.2}
    health_checks:
      - name: Music Assistant core info and stream listener
        argv:
          - docker
          - compose
          - -f
          - /opt/homelab-app/compose.yml
          - exec
          - -T
          - music_assistant
          - python3
          - -c
          - 'import socket,urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open(''http://${addresses.music_home}:8095/info'',timeout=5).close();
            socket.create_connection((''${addresses.music_home}'',8097),timeout=3).close(); print(''core service
            only: passed'')'
        expect: 'core service only: passed'
      - name: Music Assistant HTTPS route
        argv:
          - curl
          - --retry
          - '30'
          - --retry-delay
          - '2'
          - --retry-all-errors
          - --retry-max-time
          - '180'
          - --fail
          - --silent
          - --show-error
          - --max-time
          - '15'
          - --interface
          - ${addresses.music_home}
          - --resolve
          - ${domains.music}:443:${addresses.ingress_frontend}
          - https://${domains.music}/info
        expect: server_version
    service_health_checks:
      music_assistant:
        - name: Music Assistant core info and stream listener
          argv:
            - docker
            - compose
            - -f
            - /opt/homelab-app/compose.yml
            - exec
            - -T
            - music_assistant
            - python3
            - -c
            - 'import socket,urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open(''http://${addresses.music_home}:8095/info'',timeout=5).close();
              socket.create_connection((''${addresses.music_home}'',8097),timeout=3).close(); print(''core service
              only: passed'')'
          expect: 'core service only: passed'
        - name: Music Assistant HTTPS route
          argv:
            - curl
            - --retry
            - '30'
            - --retry-delay
            - '2'
            - --retry-all-errors
            - --retry-max-time
            - '180'
            - --fail
            - --silent
            - --show-error
            - --max-time
            - '15'
            - --interface
            - ${addresses.music_home}
            - --resolve
            - ${domains.music}:443:${addresses.ingress_frontend}
            - https://${domains.music}/info
          expect: server_version
    endpoints:
      music_assistant:
        web: http://${addresses.music_home}:8095
files: {}
stack:
  kind: music
  data_root: /srv/homelab/data
  guest_memory_mib: 2048
  timezone: ${timezones.applications}
  music_bind_address: ${addresses.music_home}
  services:
    music_assistant:
      memory_mib: 1536
      cpus: 2
      pids_limit: 512
      image_ref: music_assistant
