    local all postgres peer
    local all all peer
    host all all 127.0.0.1/32 scram-sha-256
    host all all ::1/128 scram-sha-256
    host all all ${addresses.pgadmin_postgresql}/32 scram-sha-256
    host all all ${addresses.identity_postgresql}/32 scram-sha-256
  homelab.conf: |
    listen_addresses = '127.0.0.1,${addresses.postgresql_backend}'
    password_encryption = 'scram-sha-256'
    shared_buffers = '256MB'
    max_connections = 100
