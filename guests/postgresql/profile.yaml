config:
  guest:
    boot_order: 20
    cpu: 2
    dns_servers:
      - ${addresses.dns}
      - ${addresses.fallback_dns}
    hostname: ${hostnames.postgresql}
    interfaces:
      - bridge: ${bridges.management}
        gateway: ${gateways.management}
        ipv4: ${addresses.postgresql_management}/${prefixes.management}
        ipv6: manual
        mac: ${mac.postgresql.0}
        vlan: ${vlans.management}
      - bridge: ${bridges.postgresql}
        ipv4: ${addresses.postgresql_backend}/${prefixes.postgresql}
        ipv6: manual
        mac: ${mac.postgresql.1}
        vlan: ${vlans.postgresql}
    keyctl: false
    memory_mib: 2048
    nesting: true
    root_gib: 4
    rules:
      - comment: Deployment runner SSH only
        direction: in
        port: '22'
        proto: tcp
        source: ${addresses.runner}/32
      - comment: Existing internal DNS
        destination: ${addresses.dns}/32
        direction: out
        port: '53'
        proto: udp
      - comment: Existing internal DNS
        destination: ${addresses.dns}/32
        direction: out
        port: '53'
        proto: tcp
      - comment: Existing internal DNS
        destination: ${addresses.fallback_dns}/32
        direction: out
        port: '53'
        proto: udp
      - comment: Existing internal DNS
        destination: ${addresses.fallback_dns}/32
        direction: out
        port: '53'
        proto: tcp
      - comment: Signed package downloads
        destination: 0.0.0.0/0
        direction: out
        port: 80,443
        proto: tcp
      - comment: postgresql approved client db-tools
        destination: ${addresses.postgresql_backend}/32
        direction: in
        port: '5432'
        proto: tcp
        source: ${addresses.pgadmin_postgresql}/32
      - comment: postgresql approved client security
        destination: ${addresses.postgresql_backend}/32
        direction: in
        port: '5432'
        proto: tcp
        source: ${addresses.identity_postgresql}/32
    start_on_boot: true
    started: true
    storage_id: ${storage.guest}
    template_file_id: ${templates.debian_lxc}
    vmid: ${vmids.postgresql}
    volumes:
      database:
        path: /var/lib/postgresql
        size_gib: 16
  app:
    address: ${addresses.postgresql_management}
    database:
      config_files:
        - destination: /etc/postgresql/16/main/conf.d/homelab.conf
          source: ${inputs}/homelab.conf
        - destination: /etc/postgresql/16/main/pg_hba.conf
          source: ${inputs}/pg_hba.conf
      gid: 1000
      group: postgres
      home: /var/lib/postgresql
      uid: 70
      user: postgres
      version_command:
        - /usr/lib/postgresql/16/bin/postgres
        - --version
      version_pattern: '16.10'
    health_checks:
      - argv:
          - python3
          - -c
          - import subprocess; assert subprocess.check_output(['systemctl','is-enabled','postgresql'],text=True).strip()=='enabled';
            subprocess.run(['systemctl','is-active','--quiet','postgresql'],check=True); print('SERVICE_OK')
        expect: SERVICE_OK
        name: Service is enabled and active
      - argv:
          - pg_isready
          - -h
          - ${addresses.postgresql_backend}
          - -p
          - '5432'
        expect: accepting connections
        name: PostgreSQL backend listener accepts connections
      - argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -X
          - -At
          - -v
          - ON_ERROR_STOP=1
          - -d
          - postgres
          - -c
          - SELECT 1
        expect: '1'
        name: Local maintenance query
      - argv:
          - python3
          - -c
          - import socket; s=socket.create_connection(('${addresses.postgresql_backend}',5432),timeout=5); s.close();
            print('BACKEND_OK')
        expect: BACKEND_OK
        name: Backend TCP listener
    hostname: ${hostnames.postgresql}
    kind: postgresql
    mac: ${mac.postgresql.0}
    memory_mib: 2048
    packages:
      - postgresql-16=16.10-1.pgdg13+1
      - postgresql-client-16=16.10-1.pgdg13+1
      - libpq5=16.10-1.pgdg13+1
    repositories:
      - key_path: ${inputs}/vendor.asc
        key_sha256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
        name: postgresql
        source: |
          Types: deb
          URIs: https://apt-archive.postgresql.org/pub/repos/apt
          Suites: trixie-pgdg-archive
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/postgresql.asc
    vmid: ${vmids.postgresql}
    exclusive_writer_confirmed: false
    service_health_checks:
      postgresql:
        - argv:
            - python3
            - -c
            - import subprocess; assert subprocess.check_output(['systemctl','is-enabled','postgresql'],text=True).strip()=='enabled';
              subprocess.run(['systemctl','is-active','--quiet','postgresql'],check=True); print('SERVICE_OK')
          expect: SERVICE_OK
          name: Service is enabled and active
        - argv:
            - pg_isready
            - -h
            - ${addresses.postgresql_backend}
            - -p
            - '5432'
          expect: accepting connections
          name: PostgreSQL backend listener accepts connections
        - argv:
            - runuser
            - -u
            - postgres
            - --
            - psql
            - -X
            - -At
            - -v
            - ON_ERROR_STOP=1
            - -d
            - postgres
            - -c
            - SELECT 1
          expect: '1'
          name: Local maintenance query
        - argv:
            - python3
            - -c
            - import socket; s=socket.create_connection(('${addresses.postgresql_backend}',5432),timeout=5); s.close();
              print('BACKEND_OK')
          expect: BACKEND_OK
          name: Backend TCP listener
    published_services:
      postgresql:
        hostname: ${hostnames.postgresql_database}
        addresses:
          backend: ${addresses.postgresql_backend}
        dns_address: backend
        protocol: tcp
        port: 5432
    database_administrators:
      cloudbeaver-postgresql-admin:
        username: ${accounts.postgresql_admin}
        source_guest: db-tools
        credential_id: ${credentials.postgresql_admin}
        credential_file: ${inputs}/managed-${credentials.postgresql_admin}.json
        access: server-administration
        transport: tls
