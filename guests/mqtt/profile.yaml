config:
  guest:
    vmid: ${vmids.mqtt}
    hostname: ${hostnames.mqtt}
    cpu: 1
    memory_mib: 1024
    root_gib: 8
    storage_id: ${storage.guest}
    template_file_id: ${templates.debian_lxc}
    started: true
    start_on_boot: true
    boot_order: 50
    nesting: true
    keyctl: false
    dns_servers:
      - ${addresses.dns}
      - ${addresses.fallback_dns}
    interfaces:
      - bridge: ${bridges.management}
        vlan: ${vlans.management}
        mac: ${mac.mqtt.0}
        ipv4: ${addresses.mqtt_management}/${prefixes.management}
        ipv6: manual
        gateway: ${gateways.management}
      - bridge: ${bridges.http_backend}
        vlan: ${vlans.http_backend}
        mac: ${mac.mqtt.1}
        ipv4: ${addresses.mqtt_backend}/${prefixes.http_backend}
        ipv6: manual
      - bridge: ${bridges.mqtt}
        vlan: ${vlans.mqtt}
        mac: ${mac.mqtt.2}
        ipv4: ${addresses.mqtt_frontend}/${prefixes.mqtt}
        ipv6: manual
    volumes:
      data:
        path: /srv/homelab
        size_gib: 4
    rules:
      - direction: in
        proto: tcp
        port: '22'
        source: ${addresses.runner}/32
        destination: ${addresses.mqtt_management}/32
        comment: Deployment runner SSH only
      - direction: out
        proto: tcp
        port: '53'
        destination: ${addresses.dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: udp
        port: '53'
        destination: ${addresses.dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: tcp
        port: '53'
        destination: ${addresses.fallback_dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: udp
        port: '53'
        destination: ${addresses.fallback_dns}/32
        comment: Selected internal DNS only
      - direction: out
        proto: tcp
        port: 80,443
        source: ${addresses.mqtt_management}/32
        destination: 0.0.0.0/0
        interface: net0
        comment: Packages, selected upstream image and provider HTTPS
      - direction: in
        proto: tcp
        port: '1883'
        comment: Declared backend MQTT client
        source: ${addresses.automation_backend}/32
        destination: ${addresses.mqtt_backend}/32
        interface: net1
      - direction: in
        proto: tcp
        port: '1883'
        comment: Declared backend MQTT client
        source: ${addresses.zigbee_backend}/32
        destination: ${addresses.mqtt_backend}/32
        interface: net1
      - direction: in
        proto: tcp
        port: 1883,8000
        comment: Retained authenticated MQTT client
        source: ${networks.home}/${prefixes.home}
        destination: ${addresses.mqtt_frontend}/32
        interface: net2
      - direction: in
        proto: tcp
        port: 1883,8000
        comment: Retained authenticated MQTT client
        source: ${networks.iot}/${prefixes.iot}
        destination: ${addresses.mqtt_frontend}/32
        interface: net2
      - direction: in
        proto: tcp
        port: 1883,8000
        comment: Retained authenticated MQTT client
        source: ${addresses.pironman_apps}/32
        destination: ${addresses.mqtt_frontend}/32
        interface: net2
      - direction: in
        proto: tcp
        port: 1883,8000
        comment: Retained authenticated MQTT client
        source: ${addresses.zigbeepi_apps}/32
        destination: ${addresses.mqtt_frontend}/32
        interface: net2
      - direction: in
        proto: tcp
        port: '80'
        source: ${addresses.ingress_backend}/32
        destination: ${addresses.mqtt_backend}/32
        interface: net1
        comment: Traefik to the authenticated MQTT Explorer gateway
      - direction: out
        proto: tcp
        port: '9000'
        source: ${addresses.mqtt_backend}/32
        destination: ${addresses.identity_backend}/32
        interface: net1
        comment: MQTT Explorer gateway to the existing Authentik outpost
  app:
    kind: mqtt
    vmid: ${vmids.mqtt}
    hostname: ${hostnames.mqtt}
    memory_mib: 1024
    address: ${addresses.mqtt_management}
    mac: ${mac.mqtt.0}
    packages:
      - docker.io=26.1.5+dfsg1-9+deb13u1
      - docker-cli=26.1.5+dfsg1-9+deb13u1
      - docker-compose=2.26.1-4
      - curl=8.14.1-2+deb13u7
    stack_config: ${inputs}/stack.json
    exclusive_writer_confirmed: false
    frontend_routing:
      address: ${addresses.mqtt_frontend}/${prefixes.mqtt}
      gateway: ${gateways.mqtt}
      mac: ${mac.mqtt.2}
    published_services:
      mqtt:
        hostname: ${hostnames.mqtt_broker}
        addresses:
          frontend: ${addresses.mqtt_frontend}
          backend: ${addresses.mqtt_backend}
        dns_address: frontend
        protocol: tcp
        port: 1883
    health_checks:
      - name: Retained MQTT credentials accepted and anonymous refused
        argv:
          - python3
          - /opt/homelab-app/automation-health.py
          - mqtt-broker
        expect: '"read_only_probe": "passed"'
      - name: MQTT Explorer private service and authentication gateway
        argv:
          - python3
          - /usr/local/bin/homelab-mqtt-explorer.py
          - health
          - --config
          - /opt/homelab-app/runtime/mqtt-explorer-public.json
        expect: '"mqtt_explorer": "passed"'
    service_health_checks:
      mqtt:
        - name: Retained MQTT credentials accepted and anonymous refused
          argv:
            - python3
            - /opt/homelab-app/automation-health.py
            - mqtt-broker
          expect: '"read_only_probe": "passed"'
      mqtt_explorer:
        - name: MQTT Explorer private service and authentication gateway
          argv:
            - python3
            - /usr/local/bin/homelab-mqtt-explorer.py
            - health
            - --config
            - /opt/homelab-app/runtime/mqtt-explorer-public.json
          expect: '"mqtt_explorer": "passed"'
    endpoints:
      mqtt_explorer:
        web: http://${addresses.mqtt_backend}:80
    service_connections:
      mqtt_explorer:
        service: mqtt.mqtt
        address: backend
files: {}
stack:
  kind: mqtt
  data_root: /srv/homelab/data
  guest_memory_mib: 1024
  timezone: ${timezones.applications}
  mqtt:
    credential_file: ${paths.mqtt_probe}
  services:
    mqtt:
      memory_mib: 256
      cpus: 1
      pids_limit: 128
      environment: {}
      extra_mounts: []
      image_ref: mqtt
    mqtt_explorer:
      memory_mib: 256
      cpus: 1
      pids_limit: 128
      environment: {}
      image_ref: mqtt_explorer
    explorer_gateway:
      memory_mib: 128
      cpus: 1
      pids_limit: 128
      environment: {}
      image_ref: traefik
  mqtt_explorer:
    public_url: https://${domains.mqtt_explorer}
    bind_address: ${addresses.mqtt_backend}
    authentik_outpost_url: http://${addresses.identity_backend}:9000
    data_path: /srv/homelab/data/mqtt-explorer
    broker_connection:
      name: MQTT broker
      hostname: ${hostnames.mqtt_broker}
      port: 1883
      username: ${accounts.mqtt_explorer}
      credential_id: ${credentials.mqtt_explorer}
      credential_file: ${inputs}/managed-${credentials.mqtt_explorer}.json
      password_file: ${paths.mqtt_password_file}
      access: read-write-all
