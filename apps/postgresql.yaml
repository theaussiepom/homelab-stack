schema: homelab-components-v1
kind: app-profile
adapter: postgresql
display_name: PostgreSQL
interfaces:
  service_interface:
    required: true
    accepts:
    - guest-interface
listeners:
  database_listener:
    service: postgresql
    namespace: host
    interface: service_interface
    bind: interface
    protocol: tcp
    port: 5432
endpoints:
  backend_endpoint:
    listener: database_listener
    protocol: tcp
    via: service_interface
storage:
  data:
    target: /var/lib/postgresql
    read_only: false
    required: true
    kind: directory
connections: {}
software:
- postgresql
runtime:
- native-postgresql
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: postgresql-agent
backup:
  include:
    data:
      category: database
      capture: database-export
  exclude: {}
