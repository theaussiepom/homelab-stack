schema: homelab-components-v1
kind: app-profile
adapter: authentik
display_name: Authentik
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
  private_interface:
    required: true
    accepts:
    - app-network
  postgresql_interface:
    required: true
    accepts:
    - guest-interface
  management_interface:
    required: false
    accepts:
    - guest-interface
listeners:
  web_listener:
    service: server
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 9000
    publish:
      scope: guest-interface
      interface: web_interface
      port: 9000
  redis_listener:
    service: redis
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 6379
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
storage:
  media:
    target: /media
    read_only: false
    required: true
    kind: directory
  templates:
    target: /templates
    read_only: false
    required: true
    kind: directory
  certs:
    target: /certs
    read_only: false
    required: true
    kind: directory
  redis:
    target: /data
    read_only: false
    required: true
    kind: directory
connections:
  database:
    type: postgresql
    required: true
    readiness:
    - start
  public:
    type: https
    required: false
    readiness:
    - start
software:
- docker
- curl
- authentik-images
runtime:
- container-host
- authentik
health:
  ready:
    profile: adapter-ready
secrets:
  secret_key:
    required: true
  postgresql_password:
    required: true
  smtp_password:
    required: false
monitoring:
  profile: docker-agent
backup:
  include:
    media:
      category: state
      capture: application-export
    templates:
      category: configuration
      capture: files
    certs:
      category: configuration
      capture: files
    redis:
      category: state
      capture: application-export
  exclude: {}
