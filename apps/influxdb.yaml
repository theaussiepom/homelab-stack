schema: homelab-components-v1
kind: app-profile
adapter: influxdb
display_name: InfluxDB
interfaces:
  service:
    required: true
    accepts:
    - guest-interface
listeners:
  web:
    service: influxdb
    namespace: host
    interface: service
    bind: interface
    protocol: tcp
    port: 8086
endpoints:
  web:
    listener: web
    protocol: http
    via: service
storage:
  data:
    target: /var/lib/influxdb
    read_only: false
    required: true
    kind: directory
connections: {}
software:
- influxdb
runtime:
- native-influxdb
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: influxdb-agent
backup:
  include:
    data:
      category: database
      capture: database-export
  exclude: {}
  configuration:
    influxdb:
      path: /etc/influxdb
      kind: directory
