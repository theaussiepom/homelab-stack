schema: homelab-components-v1
kind: app-profile
adapter: zigbee2mqtt
display_name: Zigbee2MQTT
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
  broker_interface:
    required: true
    accepts:
    - guest-interface
  private_interface:
    required: true
    accepts:
    - app-network
listeners:
  web_listener:
    service: zigbee2mqtt
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 8099
    publish:
      scope: guest-interface
      interface: web_interface
      port: 8099
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
storage:
  data:
    target: /app/data
    read_only: false
    required: true
    kind: directory
connections:
  broker:
    type: mqtt
    required: true
    readiness:
    - start
devices:
  coordinator:
    type: serial
    required: true
software:
- docker
- curl
- zigbee2mqtt-images
- yaml-parser
runtime:
- container-host
- zigbee2mqtt
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: docker-agent
backup:
  include:
    data:
      category: state
      capture: application-export
  exclude: {}
