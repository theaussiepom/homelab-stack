schema: homelab-components-v1
kind: app-profile
adapter: mqtt
display_name: MQTT
interfaces:
  backend_interface:
    required: true
    accepts:
    - guest-interface
  frontend_interface:
    required: true
    accepts:
    - guest-interface
listeners:
  mqtt_listener:
    service: mqtt
    namespace: host
    interface: backend_interface
    bind: wildcard
    protocol: tcp
    port: 1883
endpoints:
  backend_endpoint:
    listener: mqtt_listener
    protocol: tcp
    via: backend_interface
  frontend_endpoint:
    listener: mqtt_listener
    protocol: tcp
    via: frontend_interface
storage:
  config:
    target: /mosquitto/config
    read_only: false
    required: true
    kind: directory
  data:
    target: /mosquitto/data
    read_only: false
    required: true
    kind: directory
  log:
    target: /mosquitto/log
    read_only: false
    required: true
    kind: directory
connections: {}
software:
- docker
- curl
- mqtt-images
runtime:
- container-host
- mqtt
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: docker-agent
secrets:
  probe:
    required: false
backup:
  include:
    config:
      category: configuration
      capture: files
    data:
      category: state
      capture: application-export
  exclude:
    log: transient
