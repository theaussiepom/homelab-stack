schema: homelab-components-v1
kind: app-profile
adapter: mariadb
display_name: MariaDB
interfaces:
  service_interface:
    required: true
    accepts:
    - guest-interface
listeners:
  database_listener:
    service: mariadb
    namespace: host
    interface: service_interface
    bind: interface
    protocol: tcp
    port: 3306
endpoints:
  backend_endpoint:
    listener: database_listener
    protocol: tcp
    via: service_interface
storage:
  data:
    target: /var/lib/mysql
    read_only: false
    required: true
    kind: directory
connections: {}
software:
- mariadb
runtime:
- native-mariadb
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: mariadb-agent
backup:
  include:
    data:
      category: database
      capture: database-export
  exclude: {}
