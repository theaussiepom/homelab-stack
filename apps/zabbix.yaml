schema: homelab-components-v1
kind: app-profile
adapter: zabbix
display_name: Zabbix
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
  server_interface:
    required: true
    accepts:
    - guest-interface
  postgresql_interface:
    required: true
    accepts:
    - guest-interface
  metrics_interface:
    required: false
    accepts:
    - guest-interface
  management_interface:
    required: false
    accepts:
    - guest-interface
  private_interface:
    required: true
    accepts:
    - app-network
listeners:
  server_listener:
    service: zabbix_server
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 10051
    publish:
      scope: guest-interface
      interface: server_interface
      port: 10051
  web_listener:
    service: zabbix_web
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 8080
    publish:
      scope: guest-interface
      interface: web_interface
      port: 8080
  local_web_listener:
    service: zabbix_web
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 8080
    publish:
      scope: guest-loopback
      port: 8081
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
  server_endpoint:
    listener: server_listener
    protocol: tcp
    via: server_interface
storage: {}
connections:
  database:
    type: postgresql
    required: true
    readiness:
    - start
  public:
    type: https
    required: false
    readiness:
    - start
  proxmox:
    type: https
    required: false
  metrics:
    type: influxdb
    required: false
software:
- docker
- curl
- zabbix-images
runtime:
- container-host
- zabbix
health:
  ready:
    profile: adapter-ready
authentication: zabbix-saml
secrets:
  database_password:
    required: false
monitoring:
  profile: docker-agent
backup:
  include: {}
  exclude: {}
