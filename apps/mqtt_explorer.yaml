schema: homelab-components-v1
kind: app-profile
adapter: mqtt_explorer
display_name: MQTT Explorer
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
  private_interface:
    required: true
    accepts:
    - app-network
  broker_interface:
    required: true
    accepts:
    - guest-interface
listeners:
  web_listener:
    service: explorer_gateway
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 4180
    publish:
      scope: guest-interface
      interface: web_interface
      port: 80
  explorer_listener:
    service: mqtt_explorer
    namespace: app-network
    interface: private_interface
    bind: wildcard
    protocol: tcp
    port: 3000
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
storage:
  data:
    target: /app/data
    read_only: false
    required: true
    kind: directory
    initialize:
      type: directory
      uid: 1001
      gid: 1001
      mode: '0700'
connections:
  broker:
    type: mqtt
    required: true
    readiness:
    - start
    accounts:
    - mqtt-client
  outpost:
    type: http
    required: true
software:
- docker
- curl
- mqtt_explorer-images
runtime:
- container-host
- mqtt_explorer
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: docker-agent
backup:
  include:
    data:
      category: state
      capture: application-export
  exclude: {}
