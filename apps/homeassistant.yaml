schema: homelab-components-v1
kind: app-profile
adapter: homeassistant
display_name: Home Assistant
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
  home_interface:
    required: false
    accepts:
    - guest-interface
  database_interface:
    required: false
    accepts:
    - guest-interface
  metrics_interface:
    required: false
    accepts:
    - guest-interface
  broker_interface:
    required: false
    accepts:
    - guest-interface
listeners:
  web_listener:
    service: homeassistant
    namespace: host
    interface: web_interface
    bind: wildcard
    protocol: tcp
    port: 8123
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
storage:
  config:
    target: /config
    read_only: false
    required: true
    kind: directory
    initialize:
      type: directory
      uid: 0
      gid: 0
      mode: '0700'
  media:
    target: /media
    read_only: false
    required: false
    kind: directory
  community:
    target: /hacsfiles
    read_only: false
    required: false
    kind: directory
  startup:
    target: /startup
    read_only: true
    required: false
    kind: directory
connections:
  recorder:
    type: mariadb
    required: false
    readiness:
    - start
  metrics:
    type: influxdb
    required: false
    readiness:
    - start
  broker:
    type: mqtt
    required: false
    readiness:
    - start
software:
- docker
- curl
- homeassistant-upstream-images
runtime:
- container-host
- homeassistant
health:
  ready:
    profile: adapter-ready
monitoring:
  profile: docker-agent
backup:
  include:
    config:
      category: state
      capture: application-export
    media:
      category: state
      capture: application-export
    community:
      category: state
      capture: application-export
    startup:
      category: configuration
      capture: files
  exclude: {}
