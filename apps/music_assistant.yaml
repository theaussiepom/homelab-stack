schema: homelab-components-v1
kind: app-profile
adapter: music_assistant
display_name: Music Assistant
interfaces:
  web_interface:
    required: true
    accepts:
    - guest-interface
listeners:
  web_listener:
    service: music_assistant
    namespace: host
    interface: web_interface
    bind: interface
    protocol: tcp
    port: 8095
  stream_listener:
    service: music_assistant
    namespace: host
    interface: web_interface
    bind: interface
    protocol: tcp
    port: 8097
endpoints:
  web_endpoint:
    listener: web_listener
    protocol: http
    via: web_interface
    http_check:
      path: /info
      contains: server_version
  stream_endpoint:
    listener: stream_listener
    protocol: http
    via: web_interface
storage:
  data:
    target: /data
    read_only: false
    required: true
    kind: directory
connections:
  public:
    type: https
    required: false
    readiness:
    - start
software:
- docker
- curl
- music_assistant-images
runtime:
- container-host
- music_assistant
health:
  ready:
    profile: adapter-ready
    source_interface: web_interface
monitoring:
  profile: docker-agent
backup:
  include:
    data:
      category: state
      capture: application-export
  exclude: {}
