schema: homelab-components-v1
kind: app-profile
adapter: traefik
display_name: Traefik
interfaces:
  frontend_interface:
    required: true
    accepts:
    - guest-interface
  management_interface:
    required: false
    accepts:
    - guest-interface
  backend_interface:
    required: false
    accepts:
    - guest-interface
  metrics_interface:
    required: false
    accepts:
    - guest-interface
listeners:
  http_listener:
    service: traefik
    namespace: host
    interface: frontend_interface
    bind: interface
    protocol: tcp
    port: 80
  https_listener:
    service: traefik
    namespace: host
    interface: frontend_interface
    bind: interface
    protocol: tcp
    port: 443
endpoints:
  http_endpoint:
    listener: http_listener
    protocol: http
    via: frontend_interface
  https_endpoint:
    listener: https_listener
    protocol: https
    via: frontend_interface
  dashboard_endpoint:
    internal: dashboard
properties:
  dashboard: false
storage:
  certs:
    target: /var/traefik/certs
    read_only: false
    required: true
    kind: directory
connections:
  provider:
    type: https
    required: false
software:
- docker
- curl
- traefik-images
- network-tools
runtime:
- container-host
- traefik
health:
  ready:
    profile: adapter-ready
secrets:
  cloudflare_dns_token:
    required: false
  proxmox_token:
    required: false
  cloudflare_origin_token:
    required: false
monitoring:
  profile: docker-agent
backup:
  include:
    certs:
      category: state
      capture: application-export
  exclude: {}
