# Synthetic component source; supply real context and identity bindings before admission.
schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
secret_sources:
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
external_endpoints:
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
policies:
  network:
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination: 0.0.0.0/0
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination: 0.0.0.0/0
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination: 0.0.0.0/0
        comment: Recursive DNS
guests:
  resolver:
    context: lab
    template: base
    lifecycle: fresh
    identity:
      vmid: 610
      hostname: example-resolver
    template_file_id: example:vztmpl/debian.tar.zst
    root_storage: local
    interfaces:
      primary:
        network: services
        slot: 0
        mac: 02:00:00:20:00:10
        address:
          mode: static
          value: 198.18.20.10
        default_route: true
        ipv6: manual
    network_policy:
    - policy: deployment
      endpoints:
        runner:
          external: runner
    - downloads
    - recursive_dns
    control_interface: primary
apps:
  recursive_dns:
    profile: unbound
    guest: resolver
    lifecycle: fresh
    interfaces:
      service:
        scope: guest-loopback
      private:
        scope: app-network
        network: default
