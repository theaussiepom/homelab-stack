name: Validate stack
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out stack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Scan authored history, not GitHub's synthetic merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Read pinned framework revision
        id: framework
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import pathlib,re
          text=pathlib.Path('.github/workflows/phase.yml').read_text()
          pins=re.findall(r'^\s*uses: ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/guest-phase\.yml@([0-9a-f]{40})\s*$',text,re.M)
          if len(pins)!=1:raise SystemExit('Use one immutable source selection')
          print('repository='+pins[0][0]);print('revision='+pins[0][1])
          PYCODE
      - name: Check out selected framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.framework.outputs.repository }}
          ref: ${{ steps.framework.outputs.revision }}
          path: framework-source
          persist-credentials: false
      - name: Install pinned test dependencies
        run: python3 -m pip install --require-hashes -r framework-source/requirements.lock.txt
      - name: Check repository boundaries
        run: python3 framework-source/tools/check_boundaries.py --mode stack --root .
      - name: Check generated workflows
        run: python3 framework-source/blueprints/workflows.py --stack . --site site.example.yaml --check
      - name: Install verified secret scanner
        run: python3 framework-source/.github/scripts/install_gitleaks.py "$RUNNER_TEMP/homelab-source-tools"
      - name: Compile examples
        run: |
          python3 framework-source/blueprints/compile.py --stack . --site site.example.yaml --check
          python3 framework-source/blueprints/compile.py --stack . --site examples/site.second.yaml --check
      - name: Run stack tests and enforce coverage
        # Includes declaration/docs drift, real examples, navigation and the
        # independent test_ci_workflows required-collection assertion.
        env:
          HOMELAB_FRAMEWORK: framework-source
          GITLEAKS_BIN: ${{ runner.temp }}/homelab-source-tools/gitleaks
        run: python3 framework-source/tools/measure_coverage.py --suite stack --stack . --fail-under 100 --output "$RUNNER_TEMP/stack-coverage"
      - name: Set up Node for the actual Renovate manager tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
      - name: Validate catalogue extraction and replacement with Renovate
        run: |
          npm ci --prefix tests/renovate --no-audit --no-fund
          npm test --prefix tests/renovate
      - name: Scan source and complete history
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 .github/scripts/check_history.py --framework framework-source --scanner "$RUNNER_TEMP/homelab-source-tools/gitleaks" --head "$HEAD_SHA" --base "$BASE_SHA"
