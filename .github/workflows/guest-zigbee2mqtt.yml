name: Zigbee2MQTT
'on':
  workflow_call:
    inputs:
      disabled:
        type: string
        required: false
        default: '[]'
      runner_labels:
        type: string
        required: true
      environment_name:
        type: string
        required: true
    secrets:
      APPLICATION_SSH_KEY:
        required: true
      PROXMOX_APP_TOKEN:
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  infrastructure:
    name: Infra
    if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(fromJSON(inputs.disabled || '[]'), 'zigbee2mqtt')
    environment: ${{ inputs.environment_name }}
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 45
    env:
      HOMELAB_DEPLOYMENT_WORKFLOW: ${{ github.workflow_ref }}
    steps:
    - name: Preserve bootstrap custody
      run: 'test ! -e /var/lib/homelab-bootstrap/CONFIGURING

        test ! -e /var/lib/homelab-bootstrap/BOOTSTRAP-CD-HOLD.json

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Read the private stack selection
      id: stack
      run: 'python3 - <<''PYCODE'' >> "$GITHUB_OUTPUT"

        import pathlib, re

        text = pathlib.Path(''.github/workflows/deploy.yml'').read_text()

        pins = re.findall(r''^\s*uses: ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/deploy\.yml@([0-9a-f]{40})\s*$'', text, re.M)

        if len(pins) != 1: raise SystemExit(''Select one immutable stack workflow'')

        print(''repository=''+pins[0][0]); print(''revision=''+pins[0][1])

        PYCODE

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.stack.outputs.repository }}
        ref: ${{ steps.stack.outputs.revision }}
        path: stack-source
        persist-credentials: false
    - name: Read the framework selection
      id: framework
      run: 'python3 - <<''PYCODE'' >> "$GITHUB_OUTPUT"

        import pathlib, re

        text = pathlib.Path(''stack-source/.github/workflows/phase.yml'').read_text()

        pins = re.findall(r''^\s*uses: ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/guest-phase\.yml@([0-9a-f]{40})\s*$'', text, re.M)

        if len(pins) != 1: raise SystemExit(''Select one immutable framework workflow'')

        print(''repository=''+pins[0][0]); print(''revision=''+pins[0][1])

        PYCODE

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.framework.outputs.repository }}
        ref: ${{ steps.framework.outputs.revision }}
        path: framework-source
        persist-credentials: false
    - name: Compile the admitted guest
      env:
        GUEST: zigbee2mqtt
        PHASE: infrastructure
        DISABLED: ${{ inputs.disabled }}
      run: "umask 077\npython3 framework-source/blueprints/compile.py --stack stack-source --site site.json \\\n  --guest \"$GUEST\" --disabled \"$DISABLED\" --admit \\\n  --output \"$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json\"\n"
    - name: Bind existing credentials
      env:
        GUEST: zigbee2mqtt
        PHASE: infrastructure
        PROXMOX_APP_TOKEN: ${{ secrets.PROXMOX_APP_TOKEN }}
        APPLICATION_SSH_KEY: ${{ secrets.APPLICATION_SSH_KEY }}
      run: python3 framework-source/blueprints/credentials.py --packet "$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json"
    - name: Deployment
      env:
        GUEST: zigbee2mqtt
        PHASE: infrastructure
        NODE_RED_API_TOKEN: ${{ 'zigbee2mqtt' == 'automation' && '' || '' }}
        AUTHENTIK_SECRET_KEY: ${{ 'zigbee2mqtt' == 'identity' && '' || '' }}
        AUTHENTIK_POSTGRES_PASSWORD: ${{ 'zigbee2mqtt' == 'identity' && '' || '' }}
        AUTHENTIK_SMTP_PASSWORD: ${{ 'zigbee2mqtt' == 'identity' && '' || '' }}
        PGADMIN_OAUTH_SECRET: ${{ 'zigbee2mqtt' == 'db-tools' && '' || '' }}
        CLOUDFLARE_DNS_TOKEN: ${{ 'zigbee2mqtt' == 'ingress' && '' || '' }}
      run: python3 framework-source/proxmox/applications/deploy.py --phase "$PHASE" --packet "$RUNNER_TEMP/guest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GUEST}-${PHASE}.json"
