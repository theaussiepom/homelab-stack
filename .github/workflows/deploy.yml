# Generated by homelab/blueprints/workflows.py; edit blueprint/stack definitions.
name: Deployment
'on':
  workflow_call:
    inputs:
      disabled:
        type: string
        required: false
        default: '[]'
      runner_labels:
        type: string
        required: true
      environment_name:
        type: string
        required: true
    secrets:
      APPLICATION_SSH_KEY:
        required: true
      PROXMOX_APP_TOKEN:
        required: true
      AUTOMATION_NODE_RED_API_TOKEN:
        required: false
      FOUNDATION_AUTHENTIK_POSTGRES_PASSWORD:
        required: false
      FOUNDATION_AUTHENTIK_SECRET_KEY:
        required: false
      FOUNDATION_AUTHENTIK_SMTP_PASSWORD:
        required: false
      FOUNDATION_PGADMIN_OAUTH_SECRET:
        required: false
      FOUNDATION_CLOUDFLARE_DNS_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  selection:
    name: Check guests
    if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
      name: Get settings
    - name: Choose services
      id: stack
      run: 'python3 - <<''PYCODE'' >> "$GITHUB_OUTPUT"

        import pathlib, re

        text = pathlib.Path(''.github/workflows/deploy.yml'').read_text()

        pins = re.findall(r''^(?:\s*uses:|  HOMELAB_STACK_SOURCE:) ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/deploy\.yml@([0-9a-f]{40})\s*$'', text, re.M)

        if len(pins) != 1: raise SystemExit(''Select one immutable stack workflow'')

        print(''repository=''+pins[0][0]); print(''revision=''+pins[0][1])

        PYCODE

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.stack.outputs.repository }}
        ref: ${{ steps.stack.outputs.revision }}
        path: stack-source
        persist-credentials: false
      name: Get services
    - name: Choose tools
      id: framework
      run: 'python3 - <<''PYCODE'' >> "$GITHUB_OUTPUT"

        import pathlib, re

        text = pathlib.Path(''stack-source/.github/workflows/phase.yml'').read_text()

        pins = re.findall(r''^\s*uses: ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/\.github/workflows/guest-phase\.yml@([0-9a-f]{40})\s*$'', text, re.M)

        if len(pins) != 1: raise SystemExit(''Select one immutable framework workflow'')

        print(''repository=''+pins[0][0]); print(''revision=''+pins[0][1])

        PYCODE

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.framework.outputs.repository }}
        ref: ${{ steps.framework.outputs.revision }}
        path: framework-source
        persist-credentials: false
      name: Get tools
    - name: Prepare config
      run: "umask 077\nconfig_env=$(mktemp -d \"$RUNNER_TEMP/homelab-config-XXXXXX\")\npython3 -m venv \"$config_env\"\npython3 - \"$config_env/pyyaml.lock\" <<'PYCODE'\nfrom pathlib import Path\nimport re, sys\nlock = Path('framework-source/requirements.lock.txt')\nif lock.is_symlink() or not lock.is_file() or lock.stat().st_size > 1024 * 1024:\n    raise SystemExit('Use the selected framework dependency lock')\nlines = lock.read_text().splitlines()\nstarts = [i for i, line in enumerate(lines) if line.startswith('pyyaml==')]\nif len(starts) != 1:\n    raise SystemExit('Use one exact hash-locked authored config dependency')\nfirst = starts[0]\nblock = [lines[first]]\nfor line in lines[first + 1:]:\n    if not line.startswith('    --hash='): break\n    block.append(line)\nif (not re.fullmatch(r'pyyaml==[0-9]+(?:\\.[0-9]+)+ \\\\', block[0]) or len(block) < 2\n        or any(not re.fullmatch(r'    --hash=sha256:[0-9a-f]{64} \\\\', line) for line in block[1:-1])\n        or not re.fullmatch(r'\
        \    --hash=sha256:[0-9a-f]{64}', block[-1])):\n    raise SystemExit('Use one exact hash-locked authored config dependency')\nPath(sys.argv[1]).write_text('\\n'.join(block) + '\\n')\nPYCODE\n\"$config_env/bin/python\" -m pip --isolated install --disable-pip-version-check --require-hashes --no-deps -r \"$config_env/pyyaml.lock\"\nprintf 'HOMELAB_CONFIG_PYTHON=%s/bin/python\\n' \"$config_env\" >> \"$GITHUB_ENV\"\n"
    - name: Check guests
      env:
        DISABLED: ${{ inputs.disabled }}
        DEPENDENCIES: '{"dns": [], "ingress": ["dns"], "postgresql": ["dns"], "mariadb": ["dns"], "influxdb": ["dns"], "identity": ["postgresql", "ingress"], "db-tools": ["postgresql", "mariadb", "ingress"], "automation": ["mariadb", "influxdb", "mqtt"], "bitwarden": ["ingress", "mariadb"], "pegaprox": ["dns"], "zigbee2mqtt": ["mqtt"], "monitoring": ["postgresql", "ingress"], "music": ["dns", "ingress"], "mqtt": ["dns"]}'
      run: "\"$HOMELAB_CONFIG_PYTHON\" - <<'PYCODE'\nimport json, os, sys\nfrom pathlib import Path\nsys.path.insert(0, str(Path('framework-source/blueprints').resolve()))\nfrom authored_config import read, site_path\nspec = json.loads(os.environ['DEPENDENCIES'])\ndisabled = json.loads(os.environ['DISABLED'] or '[]')\nif not (isinstance(disabled, list) and all(isinstance(name, str) for name in disabled)\n        and len(set(disabled)) == len(disabled) and set(disabled) <= set(spec)):\n    raise SystemExit('Disable only unique known guest names')\noverlay = read(site_path(Path('.')))\nif 'zabbix' in overlay and overlay['zabbix'] is not None:\n    raise SystemExit('Use an empty root zabbix property')\nmonitoring = 'zabbix' in overlay\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    print('zabbix=' + str(monitoring).lower(), file=output)\nactive = set(spec) - set(disabled)\nif not monitoring: active.discard('monitoring')\nif monitoring and active and 'monitoring' not in active:\n\
        \    raise SystemExit('Keep Zabbix enabled while deploying its monitored guests')\nif any(not set(spec[name]) <= active for name in active):\n    raise SystemExit('Cannot disable a prerequisite while its consumers remain active')\nPYCODE\n"
      id: selection
    outputs:
      zabbix: ${{ steps.selection.outputs.zabbix }}
