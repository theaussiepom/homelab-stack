name: Scan Python security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out stack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize Python security analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python security
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:python
