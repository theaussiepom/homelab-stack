name: Review PR dependencies
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
