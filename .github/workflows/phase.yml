name: Guest phase
on:
  workflow_call:
    inputs:
      enabled:
        type: string
        required: true
      runner_labels:
        type: string
        required: true
      environment_name:
        type: string
        required: true
      guest:
        type: string
        required: true
      phase:
        type: string
        required: true
permissions:
  contents: read
jobs:
  run:
    uses: theaussiepom/homelab/.github/workflows/guest-phase.yml@4f60428466b17211bb5b10fa292025672a4852bf
    with:
      enabled: ${{ inputs.enabled }}
      runner_labels: ${{ inputs.runner_labels }}
      environment_name: ${{ inputs.environment_name }}
      guest: ${{ inputs.guest }}
      phase: ${{ inputs.phase }}
    secrets: inherit
