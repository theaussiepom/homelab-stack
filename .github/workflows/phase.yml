name: Guest phase
on:
  workflow_call:
    inputs:
      disabled:
        type: string
        required: false
        default: '[]'
      runner_labels:
        type: string
        required: true
      environment_name:
        type: string
        required: true
      guest:
        type: string
        required: true
      phase:
        type: string
        required: true
permissions:
  contents: read
jobs:
  run:
    uses: theaussiepom/homelab/.github/workflows/guest-phase.yml@547e7dd6d8936626fbfa5e178984e46c10c7dece
    with:
      disabled: ${{ inputs.disabled }}
      runner_labels: ${{ inputs.runner_labels }}
      environment_name: ${{ inputs.environment_name }}
      guest: ${{ inputs.guest }}
      phase: ${{ inputs.phase }}
    secrets: inherit
