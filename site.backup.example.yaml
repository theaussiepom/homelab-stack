# Synthetic component source; supply real context and identity bindings before admission.
schema: homelab-components-v1
kind: site
contexts:
  lab:
    backend: proxmox-lxc
    node: example-node
    api_endpoint:
      external: proxmox
    trust:
      ca_file: /etc/example/ca.pem
      known_hosts: /etc/example/known_hosts
    credentials:
      api_token: api
      ssh_private_key: ssh
    paths:
      state_root: /var/lib/example/state
      backup_directory: /mnt/example/backups
      backup_mount: /mnt/example
      backup_source: nas.example.invalid:/backups
    protected_guests: []
    ssh_public_keys: []
    dns_servers:
    - external: resolver
secret_sources:
  pbs-management: {type: environment, name: PBS_API_TOKEN}
  api:
    type: file
    path: /run/example/api-token
  ssh:
    type: file
    path: /run/example/ssh-key
external_endpoints:
  pbs:
    protocol: https
    address: 192.0.2.50
    port: 8007
  proxmox:
    protocol: https
    address: 192.0.2.10
    port: 8006
  resolver:
    protocol: udp
    address: 192.0.2.53
    port: 53
  runner:
    protocol: tcp
    address: 198.18.20.2
    port: 22
networks:
  services:
    context: lab
    cidr: 198.18.20.0/24
    bridge: vmbr-example
    vlan: 220
    gateway: 198.18.20.1
storage:
  local:
    context: lab
    pool: example-local
policies:
  network:
    pbs:
      rules:
      - direction: out
        proto: tcp
        destination: {endpoint: pbs}
        port: {endpoint: pbs}
        comment: Encrypted PBS transfer
    deployment:
      rules:
      - direction: in
        proto: tcp
        source:
          endpoint: runner
        port:
          endpoint: runner
        comment: Deployment SSH
    downloads:
      rules:
      - direction: out
        proto: tcp
        port: 80,443
        destination:
          address_group: internet
        comment: Package and image downloads
    recursive_dns:
      rules:
      - direction: out
        proto: udp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
      - direction: out
        proto: tcp
        port: '53'
        destination:
          address_group: internet
        comment: Recursive DNS
guests:
  resolver:
    source: examples/backup/guests/resolver.yaml
apps:
  recursive_dns:
    source: examples/minimal/apps/recursive_dns.yaml
address_groups:
  internet:
    members:
    - 0.0.0.0/0

# Full operational example; paths and identities are synthetic, never credentials.
backup:
  management:
    credential: pbs-management
    datastore_path: /mnt/backup/recovery
  recovery_public_key:
    source: examples/backup/master-public.pem.fixture
  job:
    name: example-recovery
    destination:
      endpoint: {external: pbs}
      datastore: recovery
      namespace: guests
      fingerprint: ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab:ab
    schedule: {calendar: '02:00', jitter_seconds: 300}
    clients:
      resolver:
        staging_volume: backup-stage
        interface: primary
    capture: {pause: [], database_lock: [], influx_tokens: {}}
    limits: {max_bytes: 33554432, max_files: 10000, timeout_seconds: 300}
